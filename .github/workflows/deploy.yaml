name: Deploy Vue to Pages

on:
  push:
    branches: [master]

# GITHUB_TOKEN 預設唯讀；Deploy 要推 gh-pages 分支，需要 contents 寫入權
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
