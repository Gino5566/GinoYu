name: Deploy Vue to Pages

on:
  push:
    branches: [master]

# GITHUB_TOKEN 預設唯讀；Deploy 要推 gh-pages 分支，需要 contents 寫入權
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      # SPA fallback：GitHub Pages 對不存在的路徑端出 404.html。
      # 用 index.html 副本頂替，讓 /log 直連與重新整理都能進到 app。
      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
